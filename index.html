<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exilers HQ</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

/* Loading Screen */

#loading{
position:fixed;
width:100%;
height:100vh;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
flex-direction:column;
}

.loader{
width:120px;
height:120px;
border-radius:50%;
border:5px solid #222;
border-top:5px solid #ff005d;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* Background */

.bg{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top left,#7b00ff55,transparent),
radial-gradient(circle at bottom right,#ff003c55,transparent),
#050505;
z-index:-1;
}

/* Navbar */

nav{
position:fixed;
width:100%;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(15px);
background:rgba(255,255,255,0.05);
z-index:1000;
}

nav ul{
display:flex;
gap:20px;
list-style:none;
}

nav a{
color:white;
text-decoration:none;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#ff005d;
}

/* Hero */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.hero img{
width:250px;
border-radius:50%;
box-shadow:0 0 40px #ff005d;
animation:float 4s infinite ease-in-out;
}

@keyframes float{
50%{
transform:translateY(-15px);
}
}

.hero h1{
font-size:4rem;
margin-top:25px;
background:linear-gradient(to right,#c700ff,#ff004c);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
max-width:700px;
margin-top:15px;
color:#ddd;
}

/* Sections */

section{
padding:100px 10%;
}

.section-title{
font-size:2.5rem;
margin-bottom:40px;
text-align:center;
}

backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
